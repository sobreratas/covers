<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
    <title>Covers</title>
</head>
<body>
    <div class="player-container">
    <div class="player fade-in">
        <h2>Metallica</h2>
        <i>Harvester of Sorrow</i>
        <p>March 2023</p>
        <div class="imgbox">
            <img src="ajfa.jpeg" alt="justice">
        </div>
        <audio src="harvester.mp3" type="audio/mp3" controls></audio>
    </div>
    <div class="player fade-in">
        <h2>Alabama Shakes</h2>
        <i>Hold On</i>
        <p>April 2023</p>
        <div class="imgbox">
            <img src="bag.jpeg" alt="boys and girls song">
        </div>
        <audio src="hold_on.mp3" type="audio/mp3" controls></audio>
    </div>
    <div class="player fade-in">
        <h2>System of a Down</h2>
        <i>Old School Hollywood</i>
        <p>April 2023</p>
        <div class="imgbox">
            <img src="mezmerize.jpeg" alt="mezmerize">
        </div>
        <audio src="old_school.mp3" type="audio/mp3" controls></audio>
    </div>
    <div class="player fade-in">
        <h2>The Beatles</h2>
        <i>Oh! Darling</i>
        <p>May 2023</p>
        <div class="imgbox">
            <img src="abbeyroad.jpeg" alt="abbey road">
        </div>
        <audio src="oh_darling.mp3" type="audio/mp3" controls></audio>
    </div>
    <div class="player fade-in">
        <h2>Sonic Adventure 2</h2>
        <i>Escape From The City</i>
        <p>December 2023</p>
        <div class="imgbox">
            <img src="sonic.png" alt="abbey road">
        </div>
        <audio src="escape.mp3" type="audio/mp3" controls></audio>
    </div>
    <div class="player fade-in">
        <h2>Outkast</h2>
        <i>Hey Ya!</i>
        <p>July 2024</p>
        <div class="imgbox">
            <img src="speakerbox.jpeg" alt="speakerboxxx">
        </div>
        <audio src="hey_ya.mp3" type="audio/mp3" controls></audio>
    </div>
</div>
</body>
</html>
